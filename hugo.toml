baseURL = "https://www.eleuther.ai/"
languageCode = "en-us"
title = "EleutherAI"
uglyURLs = false
disablePathToLower = true
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "RSS"]

[security.funcs]
  getenv = ['^BLOG_BASE_URL$']

[params]
  description = "EleutherAI is a non-profit AI research lab advancing open science through models, datasets, tools, and research."
  # Blog URL can be overridden with BLOG_BASE_URL environment variable for local testing
  # Production default: https://blog.eleuther.ai/
  blogBaseURL = "https://blog.eleuther.ai/"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "site-page.css"
    target = "static/site-page.css"
  [[module.mounts]]
    source = "assets/eleutherai-logo.svg"
    target = "static/assets/eleutherai-logo.svg"
  [[module.mounts]]
    source = "assets/current-site"
    target = "static/images"
