baseURL = "https://www.eleuther.ai/"
languageCode = "en-us"
title = "EleutherAI"
uglyURLs = true
disablePathToLower = true
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "RSS"]

[params]
  description = "EleutherAI is a non-profit AI research lab advancing open science through models, datasets, tools, and research."

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "content-blog"
    target = "content/blog"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "site-page.css"
    target = "static/site-page.css"
  [[module.mounts]]
    source = "assets/eleutherai-logo.svg"
    target = "static/assets/eleutherai-logo.svg"
  [[module.mounts]]
    source = "assets/blog"
    target = "static/images/blog"
  [[module.mounts]]
    source = "assets/current-site"
    target = "static/images"
