{{ define "main" }}
{{ $mainBase := site.Params.mainBaseURL | default "" }}
{{ $researchURL := cond (ne $mainBase "") (printf "%sresearch/" $mainBase) ("research/" | relURL) }}
<main>
  <section class="hero">
    <div class="wrap">
      <h1>Page not found</h1>
      <p class="lede">The page you’re looking for doesn’t exist or has moved.</p>
      <div class="button-row">
        <a class="button primary" href="{{ "/" | relURL }}">Return home</a>
        <a class="button secondary" href="{{ $researchURL }}">Explore research</a>
      </div>
    </div>
  </section>
</main>
{{ end }}
