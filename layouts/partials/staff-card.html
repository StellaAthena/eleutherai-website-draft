<article class="staff-card">
  <div class="staff-photo">
    {{ if .image }}
      <img src="{{ .image }}" alt="{{ .name }}">
    {{ else }}
      <span aria-hidden="true">
        {{ range first 2 (split .name " ") }}{{ substr . 0 1 }}{{ end }}
      </span>
    {{ end }}
  </div>
  <h2>{{ .name }}</h2>
  {{ with .title }}<p class="staff-title">{{ . }}</p>{{ end }}
  {{ with .scholar_url }}
    <div class="staff-link-line">
      <a class="staff-scholar-link" href="{{ . }}" target="_blank" rel="noopener noreferrer" aria-label="Google Scholar" title="Google Scholar">
        <svg viewBox="0 0 24 24" role="img" aria-hidden="true">
          <path class="scholar-cap" d="M1.5 8.35 12 2l10.5 6.35L12 14.7 1.5 8.35Z"/>
          <path class="scholar-book" d="M5.3 11.4v5.25C7.1 19 9.35 20.2 12 20.2s4.9-1.2 6.7-3.55V11.4L12 15.45 5.3 11.4Z"/>
          <path class="scholar-tassel" d="M21 9v6.1"/>
          <circle class="scholar-tassel-dot" cx="21" cy="16.9" r="1.1"/>
        </svg>
      </a>
    </div>
  {{ end }}
</article>
