{{ define "main" }}
<main>
  <section class="hero">
    <div class="wrap">
      <h1>{{ .Title }}</h1>
      {{ with .Params.lede }}<p class="lede">{{ . }}</p>{{ end }}
    </div>
  </section>

  {{ with .Content }}
    <section class="section research-goals">
      <div class="wrap">
        <div class="section-head">
          <div><h2>Research goals</h2></div>
          <div class="prose">
            {{ . }}
          </div>
        </div>
      </div>
    </section>
  {{ end }}
</main>
{{ end }}
