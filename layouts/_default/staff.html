{{ define "main" }}
<main>
  <section class="hero">
    <div class="wrap">
      <h1>{{ .Title }}</h1>
      {{ with .Params.lede }}<p class="lede">{{ . }}</p>{{ end }}
    </div>
  </section>

  {{ with site.Data.staff.staff }}
    <section class="section staff-directory">
      <div class="wrap">
        <div class="staff-grid">
          {{ range sort . "sort_name" }}
            {{ partial "staff-card.html" . }}
          {{ end }}
        </div>
      </div>
    </section>
  {{ end }}

</main>
{{ end }}
