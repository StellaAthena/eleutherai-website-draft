# Teams mirror the current org chart. `research_areas` are keys from
# data/research/areas.yaml and render as links on the staff page; each area page
# links back to its team. People without a `team` are listed under "Also".
teams:
  - key: "leadership"
    name: "Leadership"
    text: ""
  - key: "nlp"
    name: "NLP Team"
    text: "Evaluation infrastructure, open data and models, training frameworks, and HPC support for internal and external groups."
    research_areas: ["open_models", "evaluation", "multilingual", "ai4science"]
  - key: "interpretability"
    name: "Interpretability Team"
    text: "Interpretability methods, training dynamics, data attribution, open-weight safety, and behavioral safety."
    research_areas: ["interpretability", "open_weight_safety", "behavioral_safety"]
  - key: "policy"
    name: "Policy"
    text: "Data governance and licensing, and EleutherAI's engagement with AI policy."
    research_areas: ["governance"]
  - key: "operations"
    name: "Operations"
    text: ""

