    - label: "SOAR research papers"
      url: "soar/#research-papers"

partners:
  title: "Support for Other Communities"
  intro: "Open science is a community effort. We partner with organizations around the world interested in growing open science and provide a variety of forms of support, including fiscal sponsorship, grants, computing resources, and technical support for their research. If your organization is interested in partnering with us, please reach out to [contact@eleuther.ai](mailto:contact@eleuther.ai)"
  organizations:
    - key: "evaleval"
      name: "EvalEval Coalition"
      url: "https://evalevalai.com/"
      logo: "images/community/evaleval-logo.png"
      logo_class: "is-evaleval"
      text: >-
        How AI is measured shapes what gets built and believed. EvalEval is a global coalition of researchers, co-hosted by EleutherAI, Hugging Face and the University of Edinburgh, working to rebuild evaluation as shared open infrastructure: common ways to report results, honest accounting of where benchmarks break down, and standards that range from the benchmark all the way to policy.
      papers:
        - title: "When AI Benchmarks Plateau: A Systematic Study of Benchmark Saturation"
          url: "https://arxiv.org/abs/2602.16763"
        - title: "Every Eval Ever: A Unifying Schema and Community Repository for AI Evaluation Results"
          url: "https://arxiv.org/abs/2606.14516"
    - key: "masi"
      name: "Multi-Agent Security Initiative"
      url: "https://github.com/Multi-Agent-Security-Initiative"
      logo: "images/community/masi-logo.png"
      text: >-
        The prominence of AI agents is growing rapidly, but work on multi-agent security and safety is lagging severely behind. Founded by Ben Hagag and Michael Mulet, MASI is focused on multi-agent security as a field of its own by studying how the presence of multiple interacting agents changes the AI safety and security landscape.
      papers:
        - title: "Thought Virus: Viral Misalignment via Subliminal Prompting in Multi-Agent Systems"
          url: "https://arxiv.org/abs/2603.00131"
    - key: "data-provenance"
      name: "Data Provenance Initiative"
      url: "https://www.dataprovenance.org/"
      logo: "images/community/data-provenance-logo.svg"
      text: >-
        Modern AI is built on data whose origins, ownership, and consent are mostly undocumented. The Data Provenance Initiative is a volunteer collective of researchers that audits that foundation at scale: tracing training datasets from their origins through creation and reuse; documenting sources, licenses, creators, languages, and geographies; tracking how web consent is changing; and mapping who actually holds power in the open-model ecosystem.
      papers:
        - title: "The Data Provenance Initiative: A Large Scale Audit of Dataset Licensing & Attribution in AI"
          url: "https://doi.org/10.48550/arXiv.2310.16787"
        - title: "Economies of Open Intelligence: Tracing Power & Participation in the Model Ecosystem"
          url: "https://arxiv.org/pdf/2512.03073"
    - key: "universetbd"
      name: "UniverseTBD"
      url: "https://universetbd.org/"
      logo: "images/community/universetbd-logo.png"
      text: >-
        UniverseTBD is a collection of researchers with backgrounds in AI and across the sciences working to bring recent advancements in AI to bear on problems of interest to astrophysics researchers. They put a heavy focus on making these advances more accessible to scientists, building the datasets and tools that open discovery to more people, alongside agents that help researchers search the literature and generate new hypotheses.
      papers:
        - title: "The Multimodal Universe: Enabling Large-Scale Machine Learning with 100TB of Astronomical Scientific Data"
          url: "https://arxiv.org/abs/2412.02527"
        - title: "The Platonic Universe: Do Foundation Models See the Same Sky?"
          url: "https://arxiv.org/abs/2509.19453"

