soar:
  title: "SOAR"
  text: "Every year EleutherAI holds the Summer of Open AI Research (SOAR), a 5-week fully online research internship program. We invite people with little research experience to contribute to open science under the mentorship of experienced researchers from our staff and broader community."
  links:
    - label: "Learn about SOAR"
      url: "soar/"
    - label: "Read the retrospective"
      url: "news/a-short-retrospective-on-the-eleutherai-summer-of-open-ai-research/"
    - label: "SOAR research papers"
      url: "soar/#research-papers"

partners:
  title: "Building research communities around the world"
  intro: "Open science is a community effort. We partner with organizations around the world interested in growing open science and provide a variety of forms of support, including fiscal sponsorship, grants, computing resources, and technical support for their research. If your organization is interested in partnering with us, please reach out to [contact@eleuther.ai](mailto:contact@eleuther.ai)"
  organizations:
    - key: "masi"
      name: "Multi-Agent Security Initiative"
      url: "https://github.com/Multi-Agent-Security-Initiative"
      logo: "images/community/masi-logo.png"
      text: "A technical AI safety research community founded by Ben Hagag and Michael Mulet, studying the security challenges of a world with a rapidly growing number of AI agents."
      papers:
        - title: "Thought Virus: Viral Misalignment via Subliminal Prompting in Multi-Agent Systems"
          url: "https://arxiv.org/abs/2603.00131"
    - key: "evaleval"
      name: "EvalEval Coalition"
      url: "https://evaleval.github.io/"
      logo: "images/community/evaleval-logo.png"
      logo_class: "is-evaleval"
      text: "A global coalition of academics and other researchers working to improve the practice of evaluations in machine learning, from benchmarks to policy."
      papers:
        - title: "When AI Benchmarks Plateau: A Systematic Study of Benchmark Saturation"
          url: "https://arxiv.org/abs/2602.16763"
        - title: "Every Eval Ever: A Unifying Schema and Community Repository for AI Evaluation Results"
          url: "https://arxiv.org/abs/2606.14516"
    - key: "data-provenance"
      name: "Data Provenance Initiative"
      url: "https://www.dataprovenance.org/"
      logo: "images/community/data-provenance-logo.svg"
      text: "A volunteer collective of AI researchers conducting large-scale audits of the data, markets, and real-world uses that shape modern AI. DPI traces training datasets from their origins through creation and reuse; documents sources, licenses, creators, languages, and geographies; measures changes in web consent; studies participation and concentration in open-model ecosystems; and is extending this work to how people use and misuse AI systems in practice."
      papers:
        - title: "The Data Provenance Initiative: A Large Scale Audit of Dataset Licensing & Attribution in AI"
          url: "https://doi.org/10.48550/arXiv.2310.16787"
        - title: "Economies of Open Intelligence: Tracing Power & Participation in the Model Ecosystem"
          url: "https://arxiv.org/pdf/2512.03073"
    - key: "universetbd"
      name: "UniverseTBD"
      url: "https://universetbd.org/"
      logo: "images/community/universetbd-logo.png"
      text: "A global research lab applying frontier AI to open scientific discovery, including a 100 TB astronomy dataset spanning images, spectra, time series, and scientific metadata."
      papers:
        - title: "The Multimodal Universe: Enabling Large-Scale Machine Learning with 100TB of Astronomical Scientific Data"
          url: "https://arxiv.org/abs/2412.02527"
        - title: "The Platonic Universe: Do Foundation Models See the Same Sky?"
          url: "https://arxiv.org/abs/2509.19453"

