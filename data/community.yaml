map:
  title: "A global network of independent researchers"
  text: "EleutherAI brings together staff, volunteers, collaborators, and independent researchers across universities, nonprofits, companies, and informal research groups."
  src: "https://images.squarespace-cdn.com/content/v1/6343e7de9a7c4b05ef290bd4/62b36f8a-25e3-4b61-ba34-2ef7474e2669/The_EleutherAI_Community%284%29.png"
  alt: "Map of the EleutherAI community showing paid staff, community researchers, and community members around the world."

support:
  title: "Support for independent research communities"
  intro: "EleutherAI supports work that would otherwise be hard for independent researchers to sustain: fiscal sponsorship, direct grants, mentorship, compute access, coordination, and public releases."
  items:
    - title: "Fiscal sponsorship"
      text: "We help AI research communities receive and manage funding without needing to become standalone organizations before they can do serious work."
    - title: "Direct grants"
      text: "We provide financial support for researchers and small groups working on open science, evaluation, interpretability, and safety projects."
    - title: "Research scaffolding"
      text: "Staff and long-time contributors help with project design, engineering review, compute coordination, publication, and release practices."
  outcomes:
    - "Independent groups can accept funding and operate without immediately building a full nonprofit back office."
    - "Small research projects can get enough support to become papers, tools, datasets, workshops, or public reports."
    - "Community researchers can get institutional support while keeping the open, collaborative norms that made the work possible."

work:
  title: "What the community produces"
  intro: "The community is most legible through its outputs: research projects, tools, datasets, hackathons, papers, and public discussions."
  items:
    - title: "VQGAN-CLIP"
      text: "Early open image-generation work built and circulated through the EleutherAI community."
      url: ""
    - title: "ReLoRA"
      text: "Research on efficient training through low-rank updates."
      url: ""
    - title: "New England RLHF Hackers"
      text: "Community-organized hackathons exploring reinforcement learning from human feedback."
      url: "blog/nerh_1.html"
    - title: "EvalEval Coalition"
      text: "A collaborator-led effort focused on improving how AI evaluations are evaluated."
      url: "https://evaleval.github.io/"

profiles:
  title: "Community profiles"
  intro: "Profiles spotlight researchers whose work grew through the EleutherAI community, with links to their papers, code, talks, and interviews."
  people:
    - name: "Naomi Saphra"
