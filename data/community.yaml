soar:
  title: "Summer of Open AI Research (SOAR)"
  text: "Every year EleutherAI holds SOAR, a 5-week fully online research internship program. We invite people with little research experience to contribute to open science under the mentorship of experienced researchers from our staff and broader community."
  links:
