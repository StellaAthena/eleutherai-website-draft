      text: "Research on training dynamics, evaluation, and model behavior."
      url: ""

reading_groups:
  title: "Reading groups and recorded talks"
  intro: "Community-organized reading groups turn the Discord from a discussion forum into a working research space: people read papers together, invite authors, and record sessions for others to learn from later."
  items:
    - title: "Interpretability reading group"
      text: "A recurring forum for discussing neural network interpretability papers, often with authors presenting their work."
      url: "https://www.youtube.com/@EleutherAI"
    - title: "Alignment reading groups"
      text: "Groups have worked through alignment curricula and used the community to connect newer researchers with active research conversations."
      url: "blog/alignment-eleuther.html"
    - title: "Talk archive"
      text: "Recorded meetings and talks can be collected into playlists so useful discussions remain available after the live session."
      url: "https://www.youtube.com/@EleutherAI"

participation:
  title: "How people contribute"
  items:
    - title: "Discuss papers"
      text: "Researchers use the public Discord to share work, debate results, and find collaborators."
    - title: "Join projects"
      text: "Contributors help with code, data, evaluation, analysis, writing, and replication."
    - title: "Organize groups"
      text: "Community members run reading groups, hackathons, and research meetings."
    - title: "Release artifacts"
      text: "Projects publish papers, datasets, models, tools, notes, and recordings for others to build on."
