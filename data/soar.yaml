testimonials:
- quote: Just after SOAR ended, I went on to be a MATS fellow in a very theory-heavy research stream. I think having
    participated in SOAR made the difference between me looking like 'aspiring AI/ML researcher with lots of math
    background' instead of 'physicist bandwagoning to AI'.
  name: Charles R. W.
  project: Improving Automated Interpretability Techniques, 2025
- quote: As someone from industry, this was a great opportunity for me to connect with folks looking to contribute
    to the AI ecosystem as well as gain a better understanding of academia and ongoing research.
  name: Abdul R.
  project: AI for Science and ASI X-risk Reduction Proof-of-Concept for Literature Knowledge Extraction Tool, 2025
- quote: SOAR was my first experience in an AI research program. Working remotely with experienced mentors pushed
    me to think like a researcher, from reading literature critically to designing experiments systematically to
    knowing when to ask the right questions. I'd recommend SOAR to any early-stage researcher who wants to bridge
    the gap between coursework and real research.
  name: Eryawan P. Y.
  project: An Engine for Taming LLMs - Prompt Optimisation for Verifiable Hallucination Reduction , 2025
- quote: SOAR as a program helped me tremendously as an early career researcher. Not only did it help me with research
    and introduce me to previously unknown research areas, but it also greatly helped my academic development. My
    mentor was really kind and helpful, introducing me to research beyond the program's topics. Highly recommend
    for students or people who intend to go into research.
  name: Luis F. S.
  project: How Tokenizer Features Affect Downstream Model Performance, 2025
- quote: SOAR gave me the opportunity to get my foot in the door and actually contribute to a publication-worthy
    AI research project. It connected me with talented mentors who helped build the foundations for my research
    journey.
  name: Ayesha I.
  project: An Engine for Taming LLMs - Prompt Optimisation for Verifiable Hallucination Reduction, 2025
