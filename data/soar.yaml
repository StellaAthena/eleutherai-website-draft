title: Summer of Open AI Research
lede: Work on an AI research project under the mentorship of experienced researchers
status: Applications have closed. Please come back next year!
overview:
- The Summer of Open AI Research is a 5-week, fully online research program sponsored by EleutherAI.
- We invite people with little research experience to contribute to open science under the mentorship of experienced
  researchers. Participants work on one of the projects below and are credited on work that may result in publication.
who_should_apply:
- Experienced programmers interested in AI research
- BS, MS, and PhD students in computer science, mathematics, physics, or related fields
- Self-taught researchers looking for structured mentorship
- Anyone wanting to contribute to open science
faq:
- question: Where is the event held?
  answer: The program is fully online and coordinated through the [EleutherAI Discord](https://discord.gg/eleutherai).
- question: What topics and projects are offered?
  answer: The current project list spans interpretability, AI safety, AI for science, information retrieval, computer
    vision, and generative modeling.
- question: Who is eligible to apply?
  answer: Anyone may apply. Applicants are considered based on their ability to contribute to a project.
- question: Can I apply without prior research experience?
  answer: Yes. A central goal of SOAR is to give people outside academia their first research experience.
- question: How much time does SOAR require?
  answer: The commitment differs by project. Estimated weekly hours are listed with each project.
- question: Does Open AI refer to the company behind ChatGPT?
  answer: No. Here, open AI means research conducted openly and collaboratively.
