# Reading-group series shown on the Community page.
#
# Each card is titled with `name` and links to the newest recording inside the
# group's YouTube playlist (watch?v=<video>&list=<playlist>). Find playlist IDs
# on https://www.youtube.com/@Eleuther_AI/playlists: open a playlist and copy
# the `list=` value from the URL.
#
# Until a playlist ID is filled in, `title_pattern` (a case-insensitive regex)
# selects the newest matching upload from the channel feed instead, and the
# card links to that video without a playlist.
groups:
  - name: "ML Scalability & Performance Reading Group"
    playlist_id: "PLvtrkEledFjqOLuDB_9FWL3dgivYqc6-3"
  - name: "Planning, Reasoning, and Agents Reading Group"
    playlist_id: ""
    title_pattern: "Planning, Reasoning, and Agents RG"
