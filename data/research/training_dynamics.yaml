overview:
  title: "Why study training?"
  intro: "A trained model is a snapshot of a process. To explain why it behaves as it does, we need to study the trajectory that produced it."
  paragraphs:
    - "Most AI research analyzes finished models and responds to undesirable behavior with post-training interventions. That can change what a model does without explaining why the behavior emerged, whether the intervention will persist, or how the behavior could have been prevented."
    - "Our goal is a predictive science of model development. We treat intermediate checkpoints, training data, optimization, architecture, scale, and variation across runs as evidence about how models acquire their behavior. Open model suites and reproducible training runs make it possible to test explanations against trajectories rather than fit stories to endpoints."

questions:
  title: "How we know we are making progress"
  intro: "Prediction, intervention, and design are increasingly demanding tests of an explanation. They are a way to assess the science, not the organizing philosophy of the program."
  items:
    - title: "Predict"
      text: "Forecast a model property from its training setup or early trajectory, before training finishes and ideally before it begins. We want to extend the predictive success of loss scaling to capabilities, memorization, bias, robustness, and safety-relevant behavior."
    - title: "Intervene"
      text: "Recognize when a training trajectory is heading somewhere undesirable and redirect it while training is still underway. This requires measurements that reveal when behaviors emerge and which changes to data or optimization can alter them."
    - title: "Design"
      text: "Specify desired properties in advance and construct training procedures that produce them reliably across seeds, scales, architectures, and datasets. This is the strongest test that we have identified the right objects and mechanisms."

projects:
  title: "Experimental foundations"
  intro: "This work depends on models whose histories can actually be inspected and compared."
  items:
    - title: "Pythia"
      text: "A suite of language models released with 154 intermediate checkpoints per model, consistent data ordering, and models across scales for controlled study of learning over time."
      url: "project-pythia.html"
    - title: "PolyPythias"
      text: "Repeated pretraining runs that let us distinguish stable learning phenomena from seed-specific accidents and measure variation across otherwise comparable models."
    - title: "Open checkpoints and evaluations"
      text: "Longitudinal evaluations connect changes in behavior to particular stages of training. Public checkpoints allow proposed explanations to be tested by researchers outside the original training team."

directions:
  title: "Research directions"
  intro: "We are using this framework to pursue questions where endpoint analysis has repeatedly proven insufficient."
  items:
    - title: "Mechanisms over time"
      text: "Do circuits and representations form in consistent sequences? Which high-level mechanisms persist across checkpoints and scales, and which implementation details vary across runs?"
    - title: "Memorization"
      text: "When does a model acquire particular training examples, can final memorization be predicted from early checkpoints, and can risky acquisition be detected soon enough to change the trajectory?"
    - title: "Bias and fairness"
      text: "How do representational and behavioral biases develop during training? We want to identify when interventions must occur and why apparently successful post-hoc corrections often leave underlying representations intact."
    - title: "Learning order and simplicity"
      text: "Models tend to learn some patterns before others. Characterizing this order may explain phase transitions, shortcuts, generalization strategies, and how architecture or data composition changes what is learned."

featured:
  title: "Research agenda"
  intro: "The position paper develops this program and identifies open problems across interpretability, fairness, memorization, and learning dynamics."
  paper: 'Don''t Just "Fix it in Post": A Science of AI Must Study Training Dynamics'
  authors: "Stella Biderman, Mohammad Aflah Khan, Nilofar Mireshghallah, Catherine Arnett, Fazl Barez, and Naomi Saphra"
  venue: "arXiv"
  date: "2026"
  text: "The central claim is that scientific understanding should let us explain and anticipate model development - not merely describe a finished model or patch its outputs after training."
  url: "https://arxiv.org/abs/2606.05633"
