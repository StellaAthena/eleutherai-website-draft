overview:
  title: "Why study training?"
  intro: "A trained model is a snapshot of a process. To explain why it behaves as it does, we need to study the trajectory that produced it."
  paragraphs:
    - "Most AI research analyzes finished models and responds to undesirable behavior with post-training interventions. That can change what a model does without explaining why the behavior emerged, whether the intervention will persist, or how the behavior could have been prevented."
    - "Our goal is a predictive science of model development. We treat intermediate checkpoints, training data, optimization, architecture, scale, and variation across runs as evidence about how models acquire their behavior. Open model suites and reproducible training runs make it possible to test explanations against trajectories rather than fit stories to endpoints."

projects:
  title: "Experimental foundations"
  intro: "This work depends on models whose histories can actually be inspected and compared."
  items:
    - title: "Pythia"
      text: "A suite of language models released with 154 intermediate checkpoints per model, consistent data ordering, and models across scales for controlled study of learning over time."
      url: "project-pythia.html"
    - title: "PolyPythias"
      text: "Repeated pretraining runs that let us distinguish stable learning phenomena from seed-specific accidents and measure variation across otherwise comparable models."
    - title: "Open checkpoints and evaluations"
      text: "Longitudinal evaluations connect changes in behavior to particular stages of training. Public checkpoints allow proposed explanations to be tested by researchers outside the original training team."

directions:
  title: "Research directions"
  intro: "Our work concentrates on four connected directions: how learning unfolds, how data shapes it, what a successful science should let us do, and the open infrastructure needed to make that science possible."
  items:
    - title: "Emergence and Learning Order"
      text: "Capabilities and mechanisms do not appear all at once. We study which regularities models learn first, when new behaviors become measurable, and whether developmental patterns remain consistent across checkpoints and scales."
      links:
        - label: "Neural Networks Learn Statistics of Increasing Complexity"
          url: "https://arxiv.org/abs/2402.04362"
        - label: "LLM Circuit Analyses Are Consistent Across Training and Scale"
          url: "https://arxiv.org/abs/2407.10827"
        - label: "Why Has Predicting Downstream Capabilities of Frontier AI Models with Scale Remained Elusive?"
          url: "https://arxiv.org/abs/2406.04391"
    - title: "Data Attribution"
      text: "Training data leaves a developmental record in model behavior and representations. We build methods for identifying which examples and datasets shaped a capability, tracing failures to their origins, and locating useful points of intervention."
      links:
        - label: "Bergson"
          url: "https://github.com/EleutherAI/bergson"
        - label: "Mitigating Emergent Misalignment with Data Attribution"
          url: "https://openreview.net/forum?id=gN7pWmjiQW"
        - label: "Where Does Social Reasoning Come From? Capability Provenance in Language Models"
          url: "https://scholar.google.com/citations?view_op=view_citation&hl=en&user=to2WKckAAAAJ&sortby=pubdate&citation_for_view=to2WKckAAAAJ:wlzmIqt2EaEC"
    - title: "Predict, Intervene, Design"
      text: "A useful explanation should let us forecast how a model will develop, redirect an undesirable trajectory while training is underway, and ultimately design training procedures that reliably produce intended properties."
      links:
        - label: "Pythia"
          url: "project-pythia.html"
        - label: "Emergent and Predictable Memorization"
          url: "https://arxiv.org/abs/2304.11158"
        - label: "Multitask Prompted Training Enables Zero-Shot Task Generalization"
          url: "https://iclr.cc/virtual/2022/poster/7101"
    - title: "Open Tooling"
      text: "Training dynamics requires inspectable histories rather than final weights alone. We release checkpoints, code, attribution methods, and interpretability tools so developmental claims can be reproduced, challenged, and extended."
      links:
        - label: "Pythia"
          url: "project-pythia.html"
        - label: "PolyPythias"
          url: "https://arxiv.org/abs/2503.09543"
        - label: "Bergson"
          url: "https://github.com/EleutherAI/bergson"
        - label: "Sparse Autoencoders Find Highly Interpretable Features in Language Models"
          url: "https://arxiv.org/abs/2309.08600"

featured:
  title: "Research agenda"
  intro: "The position paper develops this program and identifies open problems across interpretability, fairness, memorization, and learning dynamics."
  paper: 'Don''t Just "Fix it in Post": A Science of AI Must Study Training Dynamics'
  authors: "Stella Biderman, Mohammad Aflah Khan, Nilofar Mireshghallah, Catherine Arnett, Fazl Barez, and Naomi Saphra"
  venue: "arXiv"
  date: "2026"
  text: "The central claim is that scientific understanding should let us explain and anticipate model development - not merely describe a finished model or patch its outputs after training."
  url: "https://arxiv.org/abs/2606.05633"
