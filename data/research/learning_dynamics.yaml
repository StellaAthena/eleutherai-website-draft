agenda:
  title: "Don’t Just \"Fix it in Post\""
  subtitle: "A Science of AI Must Study Learning Dynamics"
  authors: "Biderman, Khan, Mireshghallah, Arnett, Barez, and Saphra"
  venue: "ICML 2026 Oral"
  url: "https://arxiv.org/abs/2606.06533"

evidence:
  title: "Learning becomes visible when the training history is public"
  text: "OpenFold was retrained from the ground up with its training code, data pipeline, and intermediate behavior available for inspection. Across early checkpoints, its protein-structure predictions visibly organize during training. This is the kind of longitudinal evidence that a final model alone cannot provide."
  video: "videos/learning-dynamics/openfold-training-trajectory.mp4"
  poster: "images/learning-dynamics/openfold-training-trajectory-poster.jpg"
  paper_label: "Read the OpenFold paper"
  paper_url: "https://www.biorxiv.org/content/10.1101/2022.11.20.517210v3"
  credit: "Training trajectory animation by Gustaf Ahdritz"

directions:
  title: "What we study"
  intro: "Learning dynamics connects controlled training runs, intermediate checkpoints, longitudinal evaluation, and mechanistic analysis into a science of how models develop."
  items:
    - title: "How capabilities and mechanisms emerge"
      text: "We study when behaviors become measurable, which regularities models learn first, and whether the same mechanisms can be followed across checkpoints and scales."
      links:
        - label: "Neural networks learn statistics of increasing complexity"
          url: "https://arxiv.org/abs/2402.04362"
        - label: "Circuit analyses across training and scale"
          url: "https://arxiv.org/abs/2407.10827"
    - title: "What remains stable across runs"
      text: "Repeated pretraining runs let us distinguish robust developmental patterns from seed-specific accidents, outliers, and fragile conclusions drawn from a single model."
      links:
        - label: "PolyPythias"
          url: "https://arxiv.org/abs/2503.09543"
        - label: "Understanding gradient descent through the training Jacobian"
          url: "https://arxiv.org/abs/2412.07003"
    - title: "What can be predicted before training ends"
      text: "A useful science should forecast model behavior rather than merely describe it afterward. We test which properties can be predicted from checkpoints, scale, data exposure, and early evaluations."
      links:
        - label: "Emergent and predictable memorization"
          url: "https://arxiv.org/abs/2304.11158"
        - label: "Why capability prediction from scale remains elusive"
          url: "https://arxiv.org/abs/2406.04391"
    - title: "How trajectories can be changed"
      text: "Training is also an intervention point. We study how data order, continual pretraining, feature removal, and fine-tuning alter what a model learns and retains."
      links:
        - label: "Simple and scalable continual pretraining"
          url: "https://arxiv.org/abs/2403.08763"
        - label: "Slowing learning by erasing simple features"
          url: "https://arxiv.org/pdf/2502.02820"

pythia:
  title: "Pythia makes model development inspectable"
  text: "Pythia is a suite of language models released with intermediate checkpoints across training, consistent data ordering, multiple scales, training code, and detailed documentation. It gives researchers a shared experimental substrate for studying when capabilities, memorization, and internal mechanisms form."
  links:
    - label: "Explore the Pythia project"
      url: "/project-pythia/"
    - label: "Download checkpoints"
      url: "https://huggingface.co/EleutherAI/pythia-70m"
    - label: "Training and analysis code"
      url: "https://github.com/EleutherAI/pythia"

