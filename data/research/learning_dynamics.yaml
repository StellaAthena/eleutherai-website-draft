agenda:
  title: "Don’t Just \"Fix it in Post\""
  subtitle: "A Science of AI Must Study Learning Dynamics"
  authors: "Biderman, Khan, Mireshghallah, Arnett, Barez, and Saphra"
  venue: "ICML 2026 Oral"
  url: "https://arxiv.org/abs/2606.06533"
  summary: "A science of AI cannot be built by dissecting finished systems alone. This agenda lays out why training trajectories should be treated as primary scientific evidence—and what becomes possible when they are."

evidence:
  video: "videos/learning-dynamics/openfold-training-trajectory.mp4"
  poster: "images/learning-dynamics/openfold-training-trajectory-poster.jpg"
  hero_caption: "Across checkpoints, OpenFold’s protein-structure predictions visibly organize as the model learns."
  credit: "Training trajectory by Gustaf Ahdritz."

questions:
  title: "Questions we ask"
  intro: "Learning dynamics turns training from an invisible production process into something we can observe, compare, and reason about."
  items:
    - title: "When does a capability appear?"
      text: "Checkpoint suites let us locate when a behavior emerges and see how that moment changes with scale and data exposure."
    - title: "Do mechanisms survive scale and time?"
      text: "We follow internal circuits across checkpoints and model sizes to test whether explanations remain stable."
    - title: "What gets memorized—and when?"
      text: "We study what models retain during training and whether later memorization can be forecast from earlier evidence."
    - title: "Can we predict behavior before training ends?"
      text: "We look for early signals of downstream behavior and study when evaluation methods obscure those signals."

key_papers:
  - title: "Pythia: A Suite for Analyzing Large Language Models Across Training and Scaling"
    venue: "ICML 2023 · Oral"
    url: "https://arxiv.org/abs/2304.01373"
    summary: "A public model suite with dense intermediate checkpoints, consistent data order, and multiple scales made model development directly observable."
  - title: "PolyPythias: Stability and Outliers across Fifty Language Model Pre-Training Runs"
    venue: "ICLR 2025"
    url: "https://arxiv.org/abs/2503.09543"
    summary: "Fifty repeated pretraining runs separate robust developmental patterns from seed-specific accidents and unusual trajectories."
  - title: "LLM Circuit Analyses Are Consistent Across Training and Scale"
    venue: "NeurIPS 2024"
    url: "https://arxiv.org/abs/2407.10827"
    summary: "Circuit-level explanations can be followed through training and across model sizes rather than reconstructed from one frozen endpoint."
  - title: "Neural Networks Learn Statistics of Increasing Complexity"
    venue: "ICML 2024"
    url: "https://arxiv.org/abs/2402.04362"
    summary: "Networks learn low-order regularities first and higher-order structure later, revealing an ordered progression in what training discovers."
  - title: "Emergent and Predictable Memorization in Large Language Models"
    venue: "NeurIPS 2023"
    url: "https://arxiv.org/abs/2304.11158"
    summary: "Which examples a large model will memorize can be anticipated from smaller models and earlier points in training."
  - title: "Why Has Predicting Downstream Capabilities with Scale Remained Elusive?"
    venue: "ICML 2025 · Oral"
    url: "https://arxiv.org/abs/2406.04391"
    summary: "The signal needed to forecast capability may already exist while familiar benchmark measurements discard or distort it."

instruments:
  title: "Instruments for studying change"
  intro: "The work depends on public checkpoints, repeated runs, and training systems that make development inspectable."
  items:
    - name: "Pythia"
      type: "Model suite"
      description: "Multiple scales with dense checkpoints and known data order."
      url: "/project-pythia/"
    - name: "PolyPythias"
      type: "Repeated runs"
      description: "Fifty pretraining runs for studying stability, variance, and outliers."
      url: "https://arxiv.org/abs/2503.09543"
    - name: "OpenFold"
      type: "Training record"
      description: "An open retraining of AlphaFold2 with intermediate behavior exposed."
      url: "https://www.biorxiv.org/content/10.1101/2022.11.20.517210v3"
    - name: "GPT-NeoX"
      type: "Training code"
      description: "The open training system underlying model suites built for longitudinal study."
      url: "https://github.com/EleutherAI/gpt-neox"
