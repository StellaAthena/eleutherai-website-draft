featured_research:
  - title: "When AI Benchmarks Plateau"
    description: "A systematic analysis of when benchmarks lose the power to distinguish among top-performing models."
    finding: "29 of 60 studied benchmarks showed high or very high saturation."
    url: "https://arxiv.org/abs/2602.16763"
  - title: "Benchmark Disaggregation Improves Interpretability of Training Dynamics"
    description: "Shows how aggregate scores conceal distinct patterns of capability acquisition during training."
    finding: "The benchmark is not one measurement; its components move differently over time."
    url: "https://arxiv.org/abs/2510.24934"
  - title: "Who Evaluates AI's Social Impacts?"
    description: "Maps coverage and omissions in first- and third-party evaluations of social impacts."
    finding: "Evaluation priorities differ systematically across the organizations producing them."
    url: "https://arxiv.org/abs/2511.05613"
  - title: "Lessons from the Trenches on Reproducible Evaluation"
    description: "Documents implementation choices that make nominally identical language-model evaluations disagree."
    finding: "A score without its evaluation configuration is incomplete evidence."
    url: "https://arxiv.org/abs/2405.14782"
